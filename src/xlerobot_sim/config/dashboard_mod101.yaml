name: XLeRobot
id: xlerobot
tagline: "Mod101 7DOF \xB7 140/140 mm \xB7 RGB-D mapping \xB7 Omni base"
cameras:
- topic: /camera/color/image_raw
  label: "Head \xB7 RGB"
- topic: /camera/aligned_depth_to_color/image_raw
  label: "Head \xB7 Depth"
- topic: /camera/depth_filtered/image_raw
  label: "Head \xB7 Filtered depth"
maps:
- topic: /map
  label: RTAB-Map
- topic: /global_costmap/costmap
  label: Global costmap
- topic: /local_costmap/costmap
  label: Local costmap
topics:
  joints: /joint_states
  odom: /odom
  tracking: /odom_info_lite
  pose: /localization_pose
  plan: /plan
drive:
  topic: /cmd_vel
  type: geometry_msgs/msg/Twist
  linear_max: 0.4
  angular_max: 0.8
  omnidirectional: true
telemetry:
- section: navigation
  kind: localization
  title: Visual odometry
  topic: /odom
- section: navigation
  kind: navigation
  title: Navigation
  topic: /navigate_to_pose/_action/status
- section: navigation
  kind: plan
  title: Global plan
  topic: /plan
- section: navigation
  kind: odometry
  title: Base motion (diagnostic)
  topic: /ground_truth/odom
- section: hardware
  kind: imu
  title: Base IMU
  topic: /imu/data
- section: hardware
  kind: joints
  title: Joint feedback
  topic: /joint_states
- section: hardware
  kind: compute
  title: Compute
  topic: _system_stats
joint_groups:
- title: "Left Mod101 \xB7 7DOF"
  topic: /left_arm_controller/follow_joint_trajectory
  type: control_msgs/action/FollowJointTrajectory
  joints:
  - mod101_L_joint_base
  - mod101_L_joint_shoulder
  - mod101_L_joint_elbow
  - mod101_L_joint_wrist_yaw
  - mod101_L_joint_wrist_tilt
  - mod101_L_joint_wrist_roll
  - mod101_L_6
- title: "Right Mod101 \xB7 7DOF"
  topic: /right_arm_controller/follow_joint_trajectory
  type: control_msgs/action/FollowJointTrajectory
  joints:
  - mod101_R_joint_base
  - mod101_R_joint_shoulder
  - mod101_R_joint_elbow
  - mod101_R_joint_wrist_yaw
  - mod101_R_joint_wrist_tilt
  - mod101_R_joint_wrist_roll
  - mod101_R_6
- title: Head
  topic: /head_controller/follow_joint_trajectory
  type: control_msgs/action/FollowJointTrajectory
  joints:
  - head_pan_joint
  - head_tilt_joint
