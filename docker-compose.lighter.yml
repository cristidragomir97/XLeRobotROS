services:
  ros-dev:
    image: xlerobot:jazzy-lighter
    build:
      dockerfile: docker/Dockerfile
      args:
        ROS_RENDERING_IMAGE: multiros:jazzy-lighter
    platform: linux/arm64
    devices:
      - lighter.sh/gpu=all
    environment:
      # Vendored multiROS Mesa fixes support textured offscreen sensor rendering.
      MUJOCO_GL: ${XLEROBOT_MUJOCO_GL:-egl}
      PYOPENGL_PLATFORM: ${XLEROBOT_MUJOCO_GL:-egl}
      XLEROBOT_RENDER_QUALITY: ${XLEROBOT_RENDER_QUALITY:-fast}
      GALLIUM_DRIVER: ${XLEROBOT_GALLIUM_DRIVER:-zink}
      EGL_PLATFORM: surfaceless
      ZINK_ALLOW_MISSING_EXT_MEM_FD: "1"
