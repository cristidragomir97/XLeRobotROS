name: xlerobot
services:
  ros-dev:
    image: xlerobot:jazzy
    build:
      context: .
      dockerfile: docker/Dockerfile
      args:
        ROS_RENDERING_IMAGE: ${XLEROBOT_RENDERING_IMAGE:-multiros:jazzy-rendering}
    init: true
    tty: true
    stdin_open: true
    ports:
      - "127.0.0.1:${XLEROBOT_DASHBOARD_PORT:-8889}:8888"
    environment:
      ROS_DOMAIN_ID: ${XLEROBOT_ROS_DOMAIN_ID:-185}
      RMW_IMPLEMENTATION: rmw_cyclonedds_cpp
      # Offscreen sensor rendering; interactive windows stay on the host.
      MUJOCO_GL: ${XLEROBOT_MUJOCO_GL:-egl}
      XLEROBOT_VISUAL_MESHES: ${XLEROBOT_VISUAL_MESHES:-simplified}
      XLEROBOT_RENDER_QUALITY: ${XLEROBOT_RENDER_QUALITY:-fast}
      EGL_PLATFORM: surfaceless
      # Keep generated MJCF paths resolvable from the shared runtime on the host.
      XLEROBOT_WORLD_ASSETS: /workspace/xlerobot/assets/robocasa
      # Bind-mounted source wins over the image copy during development.
      PYTHONPATH: /workspace/xlerobot/src/xlerobot_sim:/opt/xlerobot-python/lib/python3.12/site-packages
    volumes:
      - .:/workspace/xlerobot
      - xlerobot-build:/workspace/xlerobot/build
      - xlerobot-install:/workspace/xlerobot/install
      - xlerobot-log:/workspace/xlerobot/log
volumes:
  xlerobot-build:
  xlerobot-install:
  xlerobot-log:
